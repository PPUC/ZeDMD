; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = S3-N16R8_128x32

[esp32]
framework = arduino
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
lib_deps =
    https://github.com/thomasfredericks/Bounce2/archive/6545c10e64c13a2f374930b383043de40436eb0d.tar.gz
    https://github.com/ESP32Async/AsyncTCP/archive/v3.4.10.tar.gz
    https://github.com/ESP32Async/ESPAsyncWebServer/archive/v3.10.3.tar.gz
build_flags =
    -DESP_BUILD=1
    -DNO_GFX=1
    -DNO_FAST_FUNCTIONS=1
    -DMINIZ_NO_STDIO=1
    -DMINIZ_NO_TIME=1
    -DMINIZ_NO_DEFLATE_APIS=1
    -DMINIZ_NO_ARCHIVE_APIS=1
    -DMINIZ_NO_ZLIB_COMPATIBLE_NAMES=1
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    -DCONFIG_ASYNC_TCP_STACK_SIZE=4096
    -DARDUINO_EVENT_RUNNING_CORE=0
    -Os
build_unflags = -Og

[env:WROOM-32_128x32]
extends = esp32
lib_deps = ${esp32.lib_deps}
    https://github.com/mrfaptastic/ESP32-HUB75-MatrixPanel-DMA/archive/3.0.14.tar.gz
build_flags = ${esp32.build_flags}
    -DDISPLAY_LED_MATRIX=1
    -DPIXEL_COLOR_DEPTH_BITS=8

[env:WROOM-32_128x64]
extends = esp32
lib_deps = ${esp32.lib_deps}
    https://github.com/mrfaptastic/ESP32-HUB75-MatrixPanel-DMA/archive/3.0.14.tar.gz
build_flags = ${esp32.build_flags}
    -DDISPLAY_LED_MATRIX=1
    -DPIXEL_COLOR_DEPTH_BITS=7
    -DZEDMD_HD_HALF=1

[env:S3-N16R8_128x32]
extends = esp32
board = esp32-s3-wroom-1-n16r8
board_build.partitions = partitions_16MB.csv
lib_deps = ${esp32.lib_deps}
    https://github.com/mrfaptastic/ESP32-HUB75-MatrixPanel-DMA/archive/3.0.14.tar.gz
build_flags = ${esp32.build_flags}
    -DDISPLAY_LED_MATRIX=1
    -DPIXEL_COLOR_DEPTH_BITS=8

[env:S3-N16R8_192x64]
