[ppucdmd]
platform = https://github.com/maxgerhardt/platform-raspberrypi/archive/5d4561a05e3b212660ac6fdd3fbfb328d1988aa1.tar.gz
framework = arduino
board_build.core = earlephilhower
board_build.flash_size = 2MB
board_upload.maximum_size = 2097152
board_build.filesystem = littlefs
board_build.filesystem_size = 256k
extra_scripts = pre:scripts/stage_fs_data.py
lib_deps =
    https://github.com/thomasfredericks/Bounce2/archive/6545c10e64c13a2f374930b383043de40436eb0d.tar.gz
    https://github.com/PPUC/zedmd-pico-drivers/archive/5adc6bf029df386722dd84da3e5e0395d4fd47a2.tar.gz
    https://github.com/PPUC/dmdreader/archive/a5d904ed1f1ea342e81d030987423357eef98b2f.tar.gz
lib_ignore =
    WiFi
    AsyncUDP
build_flags =
    -DBOARD_HAS_PSRAM
    -DDMDREADER=1
    -DDMDREADER_SPI_BASE=12
    -DZEDMD_NO_NETWORKING=1
    -DNO_PICO_GRAPHICS=1
    -DDISPLAY_LED_MATRIX=1
    -DMINIZ_NO_STDIO=1
    -DMINIZ_NO_TIME=1
    -DMINIZ_NO_DEFLATE_APIS=1
    -DMINIZ_NO_ARCHIVE_APIS=1
    -DMINIZ_NO_ZLIB_COMPATIBLE_NAMES=1
    -Wl,-Map,${BUILD_DIR}/firmware.map
    -Os
    -DRP2350 ; needed for dmdreader
    -DPICO_RP2350
    -DPICO_RP2350A=0 ; Not RP2350A means RP2350B
    -DHUB75_R0=30
    -DHUB75_G0=31
    -DHUB75_B0=32
    -DHUB75_R1=33
    -DHUB75_G1=34
    -DHUB75_B1=35
    -DHUB75_A=36
    -DHUB75_B=37
    -DHUB75_C=38
    -DHUB75_D=39
    -DHUB75_E=40
    -DMAX_BRIGHTNESS=10
build_unflags = -Og

