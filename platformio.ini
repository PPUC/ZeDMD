[env:LilygoS3Amoled_128x32]
extends = esp32
board = lilygo-t-display-s3
board_build.partitions = partitions_lily.csv
lib_deps = ${esp32.lib_deps}
    https://github.com/Bodmer/TFT_eSPI/archive/V2.5.43.tar.gz
