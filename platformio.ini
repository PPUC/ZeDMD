    ;-DARDUINO_USB_CDC_ON_BOOT=1 ;//Leave this for debugging
    -DDISPLAY_RM67162_AMOLED=1

[pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi/archive/5d4561a05e3b212660ac6fdd3fbfb328d1988aa1.tar.gz
framework = arduino
board_build.core = earlephilhower
board_build.filesystem = littlefs
board_build.filesystem_size = 1.5m
extra_scripts = pre:scripts/stage_fs_data.py
board_build.arduino.earlephilhower.usb_vid = 0x303a
board_build.arduino.earlephilhower.usb_pid = 0x1001
lib_deps =
    https://github.com/thomasfredericks/Bounce2/archive/6545c10e64c13a2f374930b383043de40436eb0d.tar.gz
    https://github.com/PPUC/Adafruit_TinyUSB_Arduino/archive/zedmd.tar.gz
    https://github.com/PPUC/zedmd-pico-drivers/archive/5adc6bf029df386722dd84da3e5e0395d4fd47a2.tar.gz
lib_ignore =
    SPI
    WiFi
    AsyncUDP
build_flags =
    -DZEDMD_NO_NETWORKING=1
    -DUSE_TINYUSB
    -DCFG_TUSB_CONFIG_FILE=\"tusb_config_zedmd.h\"
    -Isrc/pico
    -DNO_PICO_GRAPHICS=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDISPLAY_LED_MATRIX=1
    -DMINIZ_NO_STDIO=1
    -DMINIZ_NO_TIME=1
    -DMINIZ_NO_DEFLATE_APIS=1
    -DMINIZ_NO_ARCHIVE_APIS=1
    -DMINIZ_NO_ZLIB_COMPATIBLE_NAMES=1
    -DARDUINO_EVENT_RUNNING_CORE=0
    -DMAX_BRIGHTNESS=10
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_FREERTOS
    -Wl,-Map,${BUILD_DIR}/firmware.map
    -Os
build_unflags = -Og

